<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Almaty State College of Energy and Electronic Technologies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #fff; }
  body { font-family: 'Montserrat', Arial, Helvetica, sans-serif; -webkit-text-size-adjust: 100%; }

  :root {
    --blue: #1e88e5;
    --navy: #0d47a1;
    --gold: #ffb300;
    --line: #dce8f6;
  }

  /* ================= INTRO ================= */
  #intro {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 9999;
    background: #fff;
    overflow: hidden;
    opacity: 1;
    visibility: visible;
    -webkit-transition: opacity .8s ease, visibility .8s ease;
    transition: opacity .8s ease, visibility .8s ease;
  }
  #intro.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

  /* --- Фон: точечная сетка, растворяющаяся к краям --- */
  .grid {
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    background-image: radial-gradient(#c9dbf0 1px, transparent 1.2px);
    background-size: 26px 26px;
    opacity: .7;
  }
  .grid-fade {
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    background: radial-gradient(circle at 50% 45%, rgba(255,255,255,0) 0%, rgba(255,255,255,.55) 45%, #fff 80%);
  }

  /* --- Схемные дорожки (рисуются скриптом) --- */
  #circuit {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }
  #circuit .trace { fill: none; stroke: var(--line); stroke-width: 1.5; }
  #circuit .pulse { fill: none; stroke-width: 2.5; stroke-linecap: round; }
  #circuit .pad   { fill: #fff; stroke: #b9d2ee; stroke-width: 1.5; }
  #circuit .via   { fill: #cfe0f4; }

  /* --- Летающие искры --- */
  .spark {
    position: absolute;
    bottom: -10px;
    width: 4px; height: 4px;
    border-radius: 50%;
    opacity: 0;
    -webkit-animation: rise linear infinite;
    animation: rise linear infinite;
  }
  @-webkit-keyframes rise {
    0%   { -webkit-transform: translateY(0); opacity: 0; }
    15%  { opacity: .9; }
    100% { -webkit-transform: translateY(-105vh); opacity: 0; }
  }
  @keyframes rise {
    0%   { transform: translateY(0); opacity: 0; }
    15%  { opacity: .9; }
    100% { transform: translateY(-105vh); opacity: 0; }
  }

  /* --- Рамка по углам --- */
  .corner {
    position: absolute;
    width: 46px; height: 46px;
    border-color: var(--blue);
    border-style: solid;
    border-width: 0;
    opacity: .55;
  }
  .corner.tl { top: 22px; left: 22px; border-top-width: 2px; border-left-width: 2px; }
  .corner.tr { top: 22px; right: 22px; border-top-width: 2px; border-right-width: 2px; }
  .corner.bl { bottom: 22px; left: 22px; border-bottom-width: 2px; border-left-width: 2px; }
  .corner.br { bottom: 22px; right: 22px; border-bottom-width: 2px; border-right-width: 2px; }

  .label {
    position: absolute;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: .18em;
    color: #6f8db3;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .label.tl { top: 34px; left: 80px; }
  .label.tr { top: 34px; right: 80px; text-align: right; }
  .label.bl { bottom: 34px; left: 80px; }
  .label.br { bottom: 34px; right: 80px; text-align: right; }
  .label b { color: var(--blue); font-weight: 600; }
  .dot-live {
    display: inline-block;
    width: 7px; height: 7px;
    margin-right: 8px;
    border-radius: 50%;
    background: #2ecc71;
    vertical-align: 1px;
    -webkit-animation: blink 1.4s ease-in-out infinite;
    animation: blink 1.4s ease-in-out infinite;
  }
  @-webkit-keyframes blink { 50% { opacity: .2; } }
  @keyframes blink { 50% { opacity: .2; } }

  /* --- Центр --- */
  .center {
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-align-items: center;
    align-items: center;
    -webkit-justify-content: center;
    justify-content: center;
    padding: 20px;
  }

  .logo-wrap {
    position: relative;
    width: 240px;
    height: 240px;
    margin-bottom: 48px;
  }

  /* мягкая белая подложка, чтобы дорожки не лезли под лого */
  .halo {
    position: absolute;
    top: -30%; left: -30%; right: -30%; bottom: -30%;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 45%, rgba(255,255,255,0) 70%);
  }

  /* Орбиты с «электронами» */
  .orbit {
    position: absolute;
    border-radius: 50%;
    border: 1.5px dashed rgba(30, 136, 229, .35);
  }
  .orbit.o1 {
    top: -14%; left: -14%; right: -14%; bottom: -14%;
    -webkit-animation: spin 9s linear infinite;
    animation: spin 9s linear infinite;
  }
  .orbit.o2 {
    top: -26%; left: -26%; right: -26%; bottom: -26%;
    border: 1px solid rgba(255, 179, 0, .35);
    -webkit-animation: spin 14s linear infinite reverse;
    animation: spin 14s linear infinite reverse;
  }
  .electron {
    position: absolute;
    top: -6px; left: 50%;
    width: 11px; height: 11px;
    margin-left: -5.5px;
    border-radius: 50%;
    background: var(--blue);
    box-shadow: 0 0 0 4px rgba(30,136,229,.18), 0 0 14px rgba(30,136,229,.8);
  }
  .orbit.o2 .electron {
    background: var(--gold);
    box-shadow: 0 0 0 4px rgba(255,179,0,.2), 0 0 14px rgba(255,179,0,.8);
  }
  .orbit.o2 .electron.e2 { top: auto; bottom: -6px; width: 7px; height: 7px; margin-left: -3.5px; }

  /* Метки-деления вокруг логотипа */
  .ticks {
    position: absolute;
    top: -40%; left: -40%;
    width: 180%; height: 180%;
    -webkit-animation: spin 60s linear infinite;
    animation: spin 60s linear infinite;
  }

  @-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  .ring, .glow {
    position: absolute;
    top: 6%; left: 6%; right: 6%; bottom: 6%;
    border-radius: 50%;
  }
  .glow {
    box-shadow: 0 12px 50px rgba(30, 136, 229, .35);
    -webkit-animation: heartbeat 1.4s ease-in-out infinite;
    animation: heartbeat 1.4s ease-in-out infinite;
  }
  .ring {
    border: 3px solid rgba(30, 136, 229, .35);
    -webkit-animation: ripple 1.4s ease-out infinite;
    animation: ripple 1.4s ease-out infinite;
  }
  .ring.gold {
    border-color: rgba(255, 179, 0, .5);
    -webkit-animation-delay: .2s;
    animation-delay: .2s;
  }

  .logo {
    position: relative;
    z-index: 2;
    display: block;
    width: 100%; height: 100%;
    -webkit-animation: heartbeat 1.4s ease-in-out infinite;
    animation: heartbeat 1.4s ease-in-out infinite;
    will-change: transform;
  }

  @-webkit-keyframes heartbeat {
    0%   { -webkit-transform: scale(1); }
    14%  { -webkit-transform: scale(1.12); }
    28%  { -webkit-transform: scale(1); }
    42%  { -webkit-transform: scale(1.08); }
    70%, 100% { -webkit-transform: scale(1); }
  }
  @keyframes heartbeat {
    0%   { transform: scale(1); }
    14%  { transform: scale(1.12); }
    28%  { transform: scale(1); }
    42%  { transform: scale(1.08); }
    70%, 100% { transform: scale(1); }
  }
  @-webkit-keyframes ripple {
    0%   { -webkit-transform: scale(1); opacity: 0; }
    10%  { opacity: 1; }
    100% { -webkit-transform: scale(1.6); opacity: 0; }
  }
  @keyframes ripple {
    0%   { transform: scale(1); opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  /* Белая подложка под текстом, чтобы фон не мешал читать */
  .text-block {
    position: relative;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-align-items: center;
    align-items: center;
    padding: 10px 30px 0;
  }
  .text-block::before {
    content: "";
    position: absolute;
    top: -30px; left: -60px; right: -60px; bottom: -30px;
    background: radial-gradient(ellipse at center, #fff 55%, rgba(255,255,255,0) 72%);
    z-index: -1;
  }
  .center { z-index: 1; }

  /* --- Название --- */
  .college-name {
    position: relative;
    text-align: center;
    color: var(--navy);
    font-weight: 700;
    font-size: 28px;
    letter-spacing: .03em;
    line-height: 1.35;
    max-width: 720px;
    -webkit-animation: fadeUp 1s ease .3s both;
    animation: fadeUp 1s ease .3s both;
  }

  .divider {
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: center;
    align-items: center;
    -webkit-justify-content: center;
    justify-content: center;
    margin: 14px 0 0;
    -webkit-animation: fadeUp 1s ease .45s both;
    animation: fadeUp 1s ease .45s both;
  }
  .divider i {
    display: block;
    width: 60px; height: 1px;
    background: linear-gradient(90deg, rgba(30,136,229,0), var(--blue));
  }
  .divider i:last-child { background: linear-gradient(90deg, var(--blue), rgba(30,136,229,0)); }
  .divider em {
    display: block;
    width: 8px; height: 8px;
    margin: 0 12px;
    background: var(--gold);
    -webkit-transform: rotate(45deg);
    transform: rotate(45deg);
  }

  .words {
    position: relative;
    height: 22px;
    margin-top: 12px;
    width: 320px;
    max-width: 90vw;
    text-align: center;
    -webkit-animation: fadeUp 1s ease .5s both;
    animation: fadeUp 1s ease .5s both;
  }
  .words span {
    position: absolute;
    left: 0; right: 0; top: 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .35em;
    color: var(--blue);
    text-transform: uppercase;
    opacity: 0;
    -webkit-transform: translateY(8px);
    transform: translateY(8px);
    -webkit-transition: opacity .5s ease, -webkit-transform .5s ease;
    transition: opacity .5s ease, transform .5s ease;
  }
  .words span.on { opacity: 1; -webkit-transform: translateY(0); transform: translateY(0); }

  /* --- Кардиограмма --- */
  .ecg {
    position: relative;
    width: 300px;
    max-width: 80vw;
    height: 46px;
    margin-top: 26px;
    overflow: hidden;
    -webkit-animation: fadeUp 1s ease .6s both;
    animation: fadeUp 1s ease .6s both;
  }
  .ecg svg {
    position: absolute;
    top: 0; left: 0;
    width: 600px; height: 46px;
    -webkit-animation: ecgMove 1.4s linear infinite;
    animation: ecgMove 1.4s linear infinite;
  }
  .ecg path { fill: none; stroke: #1e88e5; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
  .ecg::before, .ecg::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    width: 70px;
    z-index: 1;
  }
  .ecg::before { left: 0;  background: linear-gradient(90deg, #fff, rgba(255,255,255,0)); }
  .ecg::after  { right: 0; background: linear-gradient(270deg, #fff, rgba(255,255,255,0)); }
  @-webkit-keyframes ecgMove { to { -webkit-transform: translateX(-150px); } }
  @keyframes ecgMove { to { transform: translateX(-150px); } }

  /* --- Прогресс --- */
  .progress {
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: center;
    align-items: center;
    margin-top: 10px;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: .2em;
    color: #6f8db3;
    -webkit-animation: fadeUp 1s ease .7s both;
    animation: fadeUp 1s ease .7s both;
  }
  .bar {
    position: relative;
    width: 160px;
    height: 3px;
    margin: 0 14px;
    background: #e3f2fd;
    border-radius: 3px;
    overflow: hidden;
  }
  .bar-fill {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 0;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--blue), var(--gold));
  }
  #status { text-transform: uppercase; }
  #pct { color: var(--navy); font-weight: 600; min-width: 42px; text-align: right; }

  @-webkit-keyframes fadeUp {
    from { opacity: 0; -webkit-transform: translateY(15px); }
    to   { opacity: 1; -webkit-transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(15px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* --- Адаптив --- */
  @media (max-width: 900px) {
    .college-name { font-size: 22px; }
  }
  @media (max-width: 600px) {
    .logo-wrap { width: 180px; height: 180px; margin-bottom: 44px; }
    .college-name { font-size: 17px; }
    .words span { font-size: 11px; letter-spacing: .28em; }
    .corner { width: 30px; height: 30px; }
    .corner.tl, .corner.tr { top: 14px; }
    .corner.bl, .corner.br { bottom: 14px; }
    .corner.tl, .corner.bl { left: 14px; }
    .corner.tr, .corner.br { right: 14px; }
    .label { font-size: 9px; letter-spacing: .12em; }
    .label.tl, .label.tr { top: 22px; }
    .label.bl, .label.br { bottom: 22px; }
    .label.tl, .label.bl { left: 52px; }
    .label.tr, .label.br { right: 52px; }
    .bar { width: 110px; }
  }
  @media (max-width: 380px) {
    .label.tr, .label.bl { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .orbit, .ticks, .spark, .ecg svg { -webkit-animation: none; animation: none; }
  }

  /* ================= САЙТ ================= */
  html, body { background: #f3f5f9; min-height: 100%; }
  body { color: #1b1f2e; }
  button { font: inherit; color: inherit; }
  a.card, a.group-btn, a.back, a.t-link { text-decoration: none; color: inherit; }
  a.t-link { text-decoration: underline; }

  .site-header {
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    max-width: 1100px;
    margin: 0 auto;
    padding: 22px 20px 6px;
  }
  .site-header img { width: 46px; height: 46px; margin-right: 14px; }
  .site-header h2 { font-size: 15px; line-height: 1.3; color: var(--navy); font-weight: 700; }

  /* Переключатель языка */
  .site-header h2 { -webkit-flex: 1; flex: 1; min-width: 0; }
  .lang-row { -webkit-flex-shrink: 0; flex-shrink: 0; margin-left: 16px; }
  .lang {
    display: -webkit-flex; display: flex;
    padding: 4px;
    background: #fff;
    border-radius: 30px;
    box-shadow: 0 4px 16px rgba(20, 30, 60, .08), 0 0 0 4px rgba(220, 224, 232, .6);
  }
  .lang button {
    border: 0; cursor: pointer;
    background: transparent;
    color: #5b6b85;
    font-size: 13px; font-weight: 700; letter-spacing: .04em;
    height: 34px; padding: 0 13px;
    border-radius: 30px;
    -webkit-tap-highlight-color: transparent;
    -webkit-transition: background .3s, color .3s;
    transition: background .3s, color .3s;
  }
  .lang button.active { background: #1b1f2e; color: #fff; }
  .lang button:not(.active):hover { background: #f1f3f7; }
  @media (max-width: 600px) {
    .site-header { -webkit-flex-wrap: wrap; flex-wrap: wrap; }
    .lang-row {
      -webkit-order: -1; order: -1;
      width: 100%;
      margin: 0 0 16px;
      display: -webkit-flex; display: flex;
      -webkit-justify-content: flex-end; justify-content: flex-end;
    }
    .site-header h2 { font-size: 14px; }
  }
  .site-header small { display: block; font-size: 11px; font-weight: 500; color: #7a8aa3; letter-spacing: .12em; text-transform: uppercase; margin-top: 2px; }

  .page {
    display: none;
    max-width: 1100px;
    margin: 0 auto;
    padding: 18px 20px 150px;           /* снизу место под навигацию */
  }
  .page.active { display: block; }
  .anim { -webkit-animation: pageIn .4s ease both; animation: pageIn .4s ease both; }
  @-webkit-keyframes pageIn { from { opacity: 0; -webkit-transform: translateY(12px); } to { opacity: 1; -webkit-transform: none; } }
  @keyframes pageIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  .page h1 { font-size: 28px; color: #1b1f2e; margin-bottom: 4px; }
  .sub { color: #7a8aa3; font-size: 14px; margin-bottom: 20px; }
  .section-title {
    font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: #7a8aa3; margin: 26px 0 12px;
  }
  .section-title:first-child { margin-top: 4px; }

  /* Поле поиска */
  .search-box {
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    background: #fff;
    border-radius: 30px;
    padding: 0 20px;
    height: 58px;
    margin-bottom: 14px;
    box-shadow: 0 2px 10px rgba(20, 30, 60, .05);
  }
  .search-box.small { height: 50px; }
  .search-box svg { width: 22px; height: 22px; margin-right: 12px; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .search-box input {
    -webkit-flex: 1; flex: 1; min-width: 0;
    border: 0; outline: 0;
    font: inherit; font-size: 16px;   /* 16px — чтобы iPhone не увеличивал страницу */
    background: transparent;
    color: #1b1f2e;
  }

  /* Переключатель-«таблетки» (дни, фильтры, периоды) */
  .chips { display: -webkit-flex; display: flex; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; margin-bottom: 14px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    -webkit-flex-shrink: 0; flex-shrink: 0;
    border: 0; cursor: pointer;
    font-size: 14px; font-weight: 600;
    padding: 10px 18px;
    margin-right: 8px;
    border-radius: 30px;
    background: #fff;
    color: #5b6b85;
    -webkit-transition: background .25s, color .25s;
    transition: background .25s, color .25s;
  }
  .chip.active { background: #1b1f2e; color: #fff; }
  .chip small { font-weight: 500; opacity: .6; margin-left: 4px; }

  /* Сетка групп */
  .course-row { margin-bottom: 18px; }
  .course-row h3 { font-size: 13px; color: #7a8aa3; font-weight: 600; margin-bottom: 10px; }
  .group-grid { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin: -4px; }
  .group-btn {
    margin: 4px;
    border: 0; cursor: pointer;
    background: #fff;
    border-radius: 16px;
    padding: 12px 16px;
    font-size: 15px; font-weight: 700;
    color: #1b1f2e;
    box-shadow: 0 2px 8px rgba(20, 30, 60, .04);
    -webkit-transition: background .2s, color .2s, -webkit-transform .2s;
    transition: background .2s, color .2s, transform .2s;
  }
  .group-btn:hover { background: #1b1f2e; color: #fff; }
  .group-btn:active { -webkit-transform: scale(.95); transform: scale(.95); }
  .group-btn.mine { box-shadow: inset 0 0 0 2px var(--gold); }

  /* Карточки преподавателей */
  .cards { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin: -6px; }
  .card {
    width: calc(33.333% - 12px);
    margin: 6px;
    padding: 16px;
    background: #fff;
    border: 0;
    border-radius: 20px;
    text-align: left;
    cursor: pointer;
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    box-shadow: 0 2px 10px rgba(20, 30, 60, .04);
    -webkit-transition: -webkit-transform .2s, box-shadow .2s;
    transition: transform .2s, box-shadow .2s;
  }
  .card:hover { -webkit-transform: translateY(-2px); transform: translateY(-2px); box-shadow: 0 8px 22px rgba(20, 30, 60, .08); }
  .card .info { -webkit-flex: 1; flex: 1; min-width: 0; }
  .card b { display: block; font-size: 15px; }
  .card span { display: block; font-size: 13px; color: #7a8aa3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .load { margin-left: 10px; text-align: right; font-size: 12px; color: #7a8aa3; white-space: nowrap; }
  .card .load strong { display: block; font-size: 18px; color: var(--navy); }
  .avatar {
    -webkit-flex-shrink: 0; flex-shrink: 0;
    width: 46px; height: 46px;
    border-radius: 50%;
    margin-right: 14px;
    background: #e8f1fc;
    color: var(--navy);
    font-weight: 700;
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
  }
  @media (max-width: 900px) { .card { width: calc(50% - 12px); } }
  @media (max-width: 560px) { .card { width: calc(100% - 12px); } }

  .empty { width: 100%; text-align: center; color: #9aa7bb; padding: 30px 0; font-size: 14px; }

  /* Кнопка «назад» */
  .back {
    display: -webkit-inline-flex; display: inline-flex;
    -webkit-align-items: center; align-items: center;
    border: 0; background: #fff; cursor: pointer;
    border-radius: 30px; padding: 9px 16px 9px 12px;
    font-size: 14px; font-weight: 600; color: #5b6b85;
    margin-bottom: 16px;
  }
  .back svg { width: 18px; height: 18px; margin-right: 6px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Профиль преподавателя */
  .profile {
    background: #fff;
    border-radius: 26px;
    padding: 22px;
    margin-bottom: 14px;
  }
  .profile-top { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; margin-bottom: 18px; }
  .profile-top .avatar { width: 64px; height: 64px; font-size: 22px; background: #1b1f2e; color: #fff; }
  .profile-top h1 { font-size: 24px; margin: 0; }
  .profile-top p { color: #7a8aa3; font-size: 14px; }
  .stats { display: -webkit-flex; display: flex; margin: 0 -5px; }
  .stat {
    -webkit-flex: 1; flex: 1;
    margin: 0 5px;
    background: #f3f5f9;
    border-radius: 18px;
    padding: 14px;
  }
  .stat strong { display: block; font-size: 26px; color: var(--navy); line-height: 1.1; }
  .stat span { font-size: 12px; color: #7a8aa3; }
  .stat.hl { background: #1b1f2e; }
  .stat.hl strong { color: #fff; }
  .stat.hl span { color: #aab4c8; }
  .tags { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin: -4px; }
  .tag { margin: 4px; padding: 8px 14px; border-radius: 14px; background: #e8f1fc; color: var(--navy); font-size: 13px; font-weight: 600; }

  .days-bars { display: -webkit-flex; display: flex; -webkit-align-items: flex-end; align-items: flex-end; height: 90px; margin-top: 8px; }
  .day-bar { -webkit-flex: 1; flex: 1; text-align: center; margin: 0 4px; }
  .day-bar i { display: block; border-radius: 8px; background: linear-gradient(180deg, var(--blue), var(--navy)); min-height: 4px; }
  .day-bar.zero i { background: #e3e8f0; }
  .day-bar span { display: block; font-size: 11px; color: #7a8aa3; margin-top: 6px; }
  .day-bar b { display: block; font-size: 12px; margin-bottom: 4px; color: #1b1f2e; }

  /* Шапка расписания группы */
  .group-head {
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: space-between; justify-content: space-between;
    background: #1b1f2e;
    color: #fff;
    border-radius: 26px;
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .group-head h1 { color: #fff; font-size: 30px; margin: 0; letter-spacing: .02em; }
  .group-head p { color: #aab4c8; font-size: 13px; margin-top: 2px; }
  .group-head .btn {
    display: inline-block; text-decoration: none; margin-left: 12px;
    border: 0; cursor: pointer;
    background: rgba(255,255,255,.12); color: #fff;
    border-radius: 30px; padding: 10px 16px;
    font-size: 13px; font-weight: 600; white-space: nowrap;
  }
  .note { display: inline-block; margin-top: 6px; padding: 3px 10px; border-radius: 10px; background: rgba(255,179,0,.2); color: #ffd36b; font-size: 12px; font-weight: 600; }

  /* Уроки */
  .week { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin: 0 -6px; }
  .day-col { width: calc(100% - 12px); margin: 0 6px 6px; }
  .week.cols .day-col { width: calc(33.333% - 12px); }
  @media (max-width: 900px) { .week.cols .day-col { width: calc(50% - 12px); } }
  @media (max-width: 600px) { .week.cols .day-col { width: calc(100% - 12px); } }
  .day-col h4 { font-size: 13px; font-weight: 700; color: #7a8aa3; text-transform: uppercase; letter-spacing: .1em; margin: 10px 4px 10px; }

  .lesson {
    display: -webkit-flex; display: flex;
    background: #fff;
    border-radius: 20px;
    padding: 14px 16px;
    margin-bottom: 8px;
    border-left: 4px solid transparent;
    -webkit-transition: opacity .3s;
    transition: opacity .3s;
  }
  .lesson .num {
    width: 36px; height: 36px; border-radius: 12px;
    background: #e8f1fc; color: var(--navy);
    font-weight: 700;
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
    margin-right: 14px;
    -webkit-flex-shrink: 0; flex-shrink: 0;
  }
  .lesson .body { -webkit-flex: 1; flex: 1; min-width: 0; }
  .lesson time { display: block; font-size: 12px; font-weight: 700; color: var(--blue); margin-bottom: 4px; }
  .v + .v { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #e1e7f0; }
  .v b { display: block; font-size: 15px; line-height: 1.3; }
  .v .meta { font-size: 13px; color: #7a8aa3; margin-top: 2px; }
  .v .meta .room { white-space: nowrap; }
  .v.none b { color: #b3bccb; font-weight: 500; }
  .t-link {
    border: 0; background: none; cursor: pointer; padding: 0;
    color: #4a5b78; font-size: 13px; text-decoration: underline;
    text-decoration-color: #c9d4e4; text-underline-offset: 2px;
  }
  .t-link:hover { color: var(--blue); }

  /* Подсветка уроков выбранного преподавателя */
  .hl-mode .lesson { opacity: .5; }
  .hl-mode .lesson.mine {
    opacity: 1;
    border-left-color: var(--gold);
    background: #fff8e6;
    box-shadow: 0 6px 18px rgba(255, 179, 0, .18);
  }
  .lesson.mine .num { background: var(--gold); color: #1b1f2e; }
  .v.mine b { color: #1b1f2e; }
  .v.mine .t-link.me { color: #b07800; font-weight: 700; text-decoration: none; }
  .legend { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; font-size: 13px; color: #7a8aa3; margin: 4px 0 10px; }
  .legend i { width: 14px; height: 14px; border-radius: 4px; background: var(--gold); margin-right: 8px; }

  .prompt { background: #fff; border-radius: 26px; padding: 22px; }
  .prompt p { color: #7a8aa3; font-size: 14px; margin-bottom: 18px; }
  .note-src { font-size: 12px; color: #9aa7bb; margin-top: 18px; }

  @media (max-width: 560px) {
    .chip { padding: 9px 13px; font-size: 13px; margin-right: 6px; }
    .page h1 { font-size: 24px; }
    .group-head { padding: 18px; }
    .group-head h1 { font-size: 24px; }
    .stat strong { font-size: 22px; }
    .profile { padding: 18px; }
  }

  /* ================= НИЖНЯЯ НАВИГАЦИЯ ================= */
  .bottom-nav {
    position: fixed;
    left: 50%;
    bottom: 18px;
    bottom: calc(18px + env(safe-area-inset-bottom));
    z-index: 100;
    width: calc(100% - 32px);
    max-width: 440px;
    padding: 10px;
    background: #fff;
    border-radius: 28px;
    box-shadow: 0 10px 40px rgba(20, 30, 60, .12), 0 0 0 6px rgba(220, 224, 232, .7);
    display: -webkit-flex; display: flex;
    -webkit-justify-content: space-between; justify-content: space-between;
    -webkit-align-items: center; align-items: center;
    /* до конца заставки навигация спрятана внизу */
    opacity: 0;
    -webkit-transform: translate(-50%, 140%);
    transform: translate(-50%, 140%);
    -webkit-transition: opacity .6s ease, -webkit-transform .7s cubic-bezier(.2, .9, .3, 1.2);
    transition: opacity .6s ease, transform .7s cubic-bezier(.2, .9, .3, 1.2);
  }
  body.site-ready .bottom-nav {
    opacity: 1;
    -webkit-transform: translate(-50%, 0);
    transform: translate(-50%, 0);
  }

  .tab {
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
    height: 56px;
    min-width: 56px;
    padding: 0 16px;
    border: 0;
    border-radius: 30px;
    background: transparent;
    color: #1b1f2e;
    font: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    -webkit-transition: background .4s ease, color .4s ease, padding .4s ease;
    transition: background .4s ease, color .4s ease, padding .4s ease;
  }
  .tab svg {
    width: 26px; height: 26px;
    -webkit-flex-shrink: 0; flex-shrink: 0;
    fill: none; stroke: currentColor; stroke-width: 1.7;
    stroke-linecap: round; stroke-linejoin: round;
    -webkit-transition: -webkit-transform .3s ease;
    transition: transform .3s ease;
  }
  .tab:active svg { -webkit-transform: scale(.88); transform: scale(.88); }
  .tab-text {
    display: block;
    max-width: 0;
    overflow: hidden;
    white-space: nowrap;
    opacity: 0;
    font-size: 15px;
    font-weight: 600;
    -webkit-transition: max-width .45s ease, opacity .3s ease, margin .45s ease;
    transition: max-width .45s ease, opacity .3s ease, margin .45s ease;
  }
  .tab.active {
    background: #1b1f2e;
    color: #fff;
    padding: 0 26px 0 20px;
  }
  .tab.active .tab-text {
    max-width: 170px;
    opacity: 1;
    margin-left: 12px;
  }
  .tab:not(.active):hover { background: #f1f3f7; }

  @media (max-width: 380px) {
    .tab.active { padding: 0 18px 0 14px; }
    .tab-text { font-size: 14px; }
  }
</style>
</head>

  function pluralIndex(lang, n) {
    if (lang === 'ru') {
      var a = n % 10, b = n % 100;
      if (a === 1 && b !== 11) return 0;
      if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return 1;

    if (lang === 'en') return n === 1 ? 0 : 1;
    return 0;

    if (val === undefined) val = I18N.ru[key];
    if (Object.prototype.toString.call(val) === '[object Array]' && key.indexOf('days') !== 0) {
      val = val[Math.min(pluralIndex(window.LANG, vars && vars.n || 0), val.length - 1)];
    }
    if (typeof val === 'string' && vars) {
      for (var k in vars) val = val.split('{' + k + '}').join(vars[k]);
    }
    return val;
  };

  // перевести все элементы с data-i18n / data-i18n-ph / data-i18n-aria
  window.applyStatic = function () {

    for (i = 0; i < els.length; i++) els[i].setAttribute('aria-label', window.t(els[i].getAttribute('data-i18n-aria')));
    els = document.querySelectorAll('.lang button');
    for (i = 0; i < els.length; i++) els[i].className = els[i].getAttribute('data-lang') === window.LANG ? 'active' : '';

<script>
(function () {
  var MIN_SHOW  = 10000;  // сколько показывать заставку при загрузке (мс)
  var MAX_WAIT  = 15000;  // максимум ожидания, даже если сайт ещё грузится (мс)
  var IDLE_TIME = 20000;  // через сколько бездействия заставка возвращается (мс)

  var intro = document.getElementById('intro');
  var SVGNS = 'http://www.w3.org/2000/svg';

  /* ---------- Метки-деления вокруг логотипа ---------- */
  var ticks = document.getElementById('ticks');
  for (var t = 0; t < 72; t++) {
    var a = t * 5 * Math.PI / 180, long = t % 6 === 0;
    var r1 = long ? 86 : 89, r2 = 93;
    var ln = document.createElementNS(SVGNS, 'line');
    ln.setAttribute('x1', 100 + r1 * Math.cos(a)); ln.setAttribute('y1', 100 + r1 * Math.sin(a));
    ln.setAttribute('x2', 100 + r2 * Math.cos(a)); ln.setAttribute('y2', 100 + r2 * Math.sin(a));
    ln.setAttribute('stroke', long ? 'rgba(30,136,229,.55)' : 'rgba(30,136,229,.22)');
    ln.setAttribute('stroke-width', long ? 1.2 : .8);
    ticks.appendChild(ln);
  }

  /* ---------- Схемные дорожки с бегущими импульсами ---------- */
  var svg = document.getElementById('circuit');
  var pulses = [];

  function buildCircuit() {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    pulses = [];
    var W = window.innerWidth, H = window.innerHeight;
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

    var lr = document.querySelector('.logo-wrap').getBoundingClientRect();
    var cx = lr.left + lr.width / 2, cy = lr.top + lr.height / 2;   // центр логотипа
    var R = Math.min(W, H) < 600 ? 150 : 210;    // где дорожки заканчиваются
    var count = W < 600 ? 14 : 22;
    var far = Math.max(W, H);

    for (var i = 0; i < count; i++) {
      // дорожки идут только сверху и по бокам — снизу текст, его не трогаем
      var from = 160 * Math.PI / 180, span = 220 * Math.PI / 180;
      var ang = from + (i / (count - 1)) * span + (Math.random() - .5) * 0.12;
      var ex = cx + R * Math.cos(ang), ey = cy + R * Math.sin(ang);

      // 1-й отрезок: под углом, кратным 45°
      var snap = Math.round(ang / (Math.PI / 4)) * (Math.PI / 4);
      var L1 = 40 + Math.random() * 90;
      var bx = ex + L1 * Math.cos(snap), by = ey + L1 * Math.sin(snap);

      // 2-й отрезок: строго по горизонтали или вертикали до края экрана
      var ox, oy;
      if (Math.abs(Math.cos(ang)) > Math.abs(Math.sin(ang))) {
        ox = Math.cos(ang) > 0 ? far : -far; oy = by;
      } else {
        ox = bx; oy = Math.sin(ang) > 0 ? far : -far;
      }

      var d = 'M' + ox + ' ' + oy + ' L' + bx + ' ' + by + ' L' + ex + ' ' + ey;

      var base = document.createElementNS(SVGNS, 'path');
      base.setAttribute('d', d); base.setAttribute('class', 'trace');
      svg.appendChild(base);

      var via = document.createElementNS(SVGNS, 'circle');
      via.setAttribute('cx', bx); via.setAttribute('cy', by); via.setAttribute('r', 2.5);
      via.setAttribute('class', 'via');
      svg.appendChild(via);

      var pad = document.createElementNS(SVGNS, 'circle');
      pad.setAttribute('cx', ex); pad.setAttribute('cy', ey); pad.setAttribute('r', 4);
      pad.setAttribute('class', 'pad');
      svg.appendChild(pad);

      var p = document.createElementNS(SVGNS, 'path');
      p.setAttribute('d', d); p.setAttribute('class', 'pulse');
      p.setAttribute('stroke', i % 3 === 0 ? '#ffb300' : '#1e88e5');
      svg.appendChild(p);

      // считаем только видимую часть дорожки
      var len = p.getTotalLength();
      var seg = 60;
      p.style.strokeDasharray = seg + ' ' + (len + seg);
      pulses.push({ el: p, len: len, seg: seg,
                    speed: 260 + Math.random() * 200,          // пикселей в секунду
                    offset: Math.random() * (len + seg) });
    }
  }

  var last = null;
  function animatePulses(ts) {
    if (last === null) last = ts;
    var dt = Math.min((ts - last) / 1000, 0.05); last = ts;
    if (!isHidden()) {
      for (var i = 0; i < pulses.length; i++) {
        var o = pulses[i];
        o.offset += o.speed * dt;
        if (o.offset > o.len + o.seg) o.offset = 0;
        // импульс движется от края экрана к логотипу
        o.el.style.strokeDashoffset = (o.seg - o.offset);
      }
    }
    requestAnimationFrame(animatePulses);
  }

  buildCircuit();
  requestAnimationFrame(animatePulses);
  var rz;
  window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(buildCircuit, 200); });

  /* ---------- Искры ---------- */
  var sparks = document.getElementById('sparks');
  var sparkCount = window.innerWidth < 600 ? 12 : 22;
  for (var s = 0; s < sparkCount; s++) {
    var sp = document.createElement('div');
    sp.className = 'spark';
    var size = 2 + Math.random() * 4;
    sp.style.width = size + 'px'; sp.style.height = size + 'px';
    sp.style.left = (Math.random() * 100) + '%';
    sp.style.background = Math.random() > .6 ? '#ffb300' : '#1e88e5';
    var dur = 7 + Math.random() * 8;
    sp.style.webkitAnimationDuration = sp.style.animationDuration = dur + 's';
    sp.style.webkitAnimationDelay = sp.style.animationDelay = (-Math.random() * dur) + 's';
    sparks.appendChild(sp);
  }

  /* ---------- Сменяющиеся слова ---------- */
  var words = document.getElementById('words').getElementsByTagName('span');
  var w = 0;
  setInterval(function () {
    words[w].className = '';
    w = (w + 1) % words.length;
    words[w].className = 'on';
  }, 1800);

  /* ---------- Часы ---------- */
  var clock = document.getElementById('clock');
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function tick() {
    var d = new Date();
    clock.innerHTML = '<b>' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + '</b>:' + pad2(d.getSeconds());
  }
  tick(); setInterval(tick, 1000);

  /* ---------- Прогресс ---------- */
  var pct = document.getElementById('pct');
  var barFill = document.getElementById('barFill');
  var status = document.getElementById('status');
  var startTime = Date.now();
  var progressTimer = setInterval(function () {
    var p = Math.min(99, Math.floor((Date.now() - startTime) / MIN_SHOW * 100));
    pct.innerHTML = p + '%';
    barFill.style.width = p + '%';
  }, 50);

  /* ---------- Логика показа / скрытия ---------- */
  var idleTimer = null, started = false;

  function isHidden() { return intro.className.indexOf('hidden') !== -1; }
  function hideIntro() { intro.className = 'hidden'; }
  function showIntro() { intro.className = ''; }

  function resetIdle() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(showIntro, IDLE_TIME);
  }

  function onActivity() {
    if (!started) return;
    if (!isHidden()) hideIntro();
    resetIdle();
  }

  function finishIntro() {
    if (started) return;
    started = true;
    clearInterval(progressTimer);
    pct.innerHTML = '100%';
    barFill.style.width = '100%';
    setTimeout(function () {
      hideIntro();
      document.body.className += ' site-ready';   // показываем навигацию
      resetIdle();
      // в режиме ожидания вместо загрузки — приглашение коснуться
      status.setAttribute('data-i18n', 'tapToContinue');
      status.textContent = window.t('tapToContinue');
      pct.innerHTML = '';
      barFill.parentNode.style.display = 'none';
    }, 400);
  }

  var minDone = false, loaded = false;
  setTimeout(function () { minDone = true; if (loaded) finishIntro(); }, MIN_SHOW);
  setTimeout(finishIntro, MAX_WAIT);

  if (document.readyState === 'complete') loaded = true;
  else window.addEventListener('load', function () { loaded = true; if (minDone) finishIntro(); });

  var events = ['mousemove', 'mousedown', 'keydown', 'scroll', 'wheel',
                'touchstart', 'touchmove', 'pointerdown', 'click'];
  for (var i = 0; i < events.length; i++) {
    window.addEventListener(events[i], onActivity, false);
    document.addEventListener(events[i], onActivity, false);
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) onActivity(); });
})();
</script>

<script>
/* ================= САЙТ: преподаватели, поиск, расписание ================= */
(function () {
  var DATA = window.SCHEDULE_DATA || [];
  var t = window.t;                              // перевод (см. скрипт языков выше)
  function DAY_SHORT(d) { return t('daysShort')[d]; }
  function DAY_FULL(d)  { return t('daysFull')[d]; }
  var PAIR_BY_START = { '08:30': 1, '10:00': 2, '11:40': 3, '13:10': 4, '14:30': 5, '14:50': 5, '16:20': 6 };

  // логотип в шапке берём из заставки (чтобы не хранить картинку дважды)
  document.getElementById('headerLogo').src = document.querySelector('#intro .logo').src;

  /* ---------- Вспомогательное ---------- */
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function enc(s) { return encodeURIComponent(s); }
  function initials(name) {
    var p = name.split(' ');
    return (p[0].charAt(0) + (p[1] ? p[1].charAt(0) : '')).toUpperCase();
  }
  function pairNo(tm) { return PAIR_BY_START[tm.slice(0, 5)] || '•'; }
  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function plural(n, one, few, many) {
    var a = n % 10, b = n % 100;
    if (a === 1 && b !== 11) return one;
    if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return few;
    return many;
  }
  function store(key, val) {
    try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch (e) { return null; }
  }

  /* ---------- Какое расписание группы действует сейчас ---------- */
  var TODAY = todayISO();
  var groupsByName = {};
  for (var gi = 0; gi < DATA.length; gi++) {
    var g = DATA[gi];
    groupsByName[g.name] = g;
    var active = -1, latest = 0;
    for (var si = 0; si < g.schedules.length; si++) {
      var s = g.schedules[si];
      var isActive = !s.from || (s.from <= TODAY && TODAY <= s.to);
      if (isActive && (active === -1 || s.from)) active = si;   // точный период важнее общего
      if ((s.to || '9999') > (g.schedules[latest].to || '9999')) latest = si;
    }
    g.cur = active !== -1 ? active : latest;
    g.ended = active === -1;
  }

  /* ---------- Статистика преподавателей (по действующим расписаниям) ---------- */
  var teachers = {};
  function T(name) {
    return teachers[name] || (teachers[name] = { name: name, pairs: 0, subjects: {}, groups: {}, days: [0, 0, 0, 0, 0, 0] });
  }
  for (gi = 0; gi < DATA.length; gi++) {
    g = DATA[gi];
    var lessons = g.schedules[g.cur].lessons;
    for (var li = 0; li < lessons.length; li++) {
      var l = lessons[li], seen = {};
      for (var vi = 0; vi < l.v.length; vi++) {
        var v = l.v[vi];
        for (var pi = 0; pi < v.p.length; pi++) {
          var tc = T(v.p[pi]);
          if (v.s) tc.subjects[v.s] = true;
          if (!seen[v.p[pi]]) {
            seen[v.p[pi]] = true;
            tc.pairs++;
            tc.days[l.d]++;
            tc.groups[g.name] = (tc.groups[g.name] || 0) + 1;
          }
        }
      }
    }
  }
  var teacherList = [];
  for (var tn in teachers) {
    teachers[tn].subjectList = Object.keys(teachers[tn].subjects);
    teacherList.push(teachers[tn]);
  }
  teacherList.sort(function (a, b) { return a.name.localeCompare(b.name, 'ru'); });

  /* ---------- Отрисовка урока ---------- */
  function lessonHTML(l, groupName, me) {
    var mine = false, vs = '';
    for (var i = 0; i < l.v.length; i++) {
      var v = l.v[i];
      var vMine = me && v.p.indexOf(me) !== -1;
      if (vMine) mine = true;
      if (!v.s && !v.p.length) {
        vs += '<div class="v none"><b>—</b></div>';
        continue;
      }
      var links = [];
      for (var k = 0; k < v.p.length; k++) {
        links.push('<a class="t-link' + (v.p[k] === me ? ' me' : '') + '" href="#teachers/' + enc(v.p[k]) + '/' + enc(groupName) + '">' + esc(v.p[k]) + '</a>');
      }
      var meta = links.join(', ');
      if (v.r) meta += (meta ? ' · ' : '') + '<span class="room">' + t('room') + ' ' + esc(v.r) + '</span>';
      vs += '<div class="v' + (vMine ? ' mine' : '') + '"><b>' + esc(v.s || '—') + '</b>' + (meta ? '<div class="meta">' + meta + '</div>' : '') + '</div>';
    }
    return '<div class="lesson' + (mine ? ' mine' : '') + '"><div class="num">' + pairNo(l.t) + '</div>' +
           '<div class="body"><time>' + esc(l.t) + '</time>' + vs + '</div></div>';
  }

  function sortLessons(list) {
    return list.slice().sort(function (a, b) { return a.d - b.d || (a.t < b.t ? -1 : a.t > b.t ? 1 : 0); });
  }

  function daysUsed(lessons) {
    var max = 4;
    for (var i = 0; i < lessons.length; i++) if (lessons[i].d > max) max = lessons[i].d;
    return max + 1;
  }

  // day: число 0–5 или 'week'; onlyMine — показать только пары преподавателя
  function scheduleHTML(lessons, groupName, day, me, onlyMine) {
    lessons = sortLessons(lessons);
    var nDays = daysUsed(lessons);
    var out = '', from = day === 'week' ? 0 : day, to = day === 'week' ? nDays - 1 : day;
    for (var d = from; d <= to; d++) {
      var html = '';
      for (var i = 0; i < lessons.length; i++) {
        if (lessons[i].d !== d) continue;
        if (onlyMine) {
          var has = false;
          for (var j = 0; j < lessons[i].v.length; j++) if (lessons[i].v[j].p.indexOf(me) !== -1) has = true;
          if (!has) continue;
        }
        html += lessonHTML(lessons[i], groupName, me);
      }
      if (!html) html = '<p class="empty" style="padding:14px 0">' + t('noClasses') + '</p>';
      out += '<div class="day-col">' + (day === 'week' ? '<h4>' + DAY_FULL(d) + '</h4>' : '') + html + '</div>';
    }
    return '<div class="week' + (day === 'week' ? ' cols' : '') + (me ? ' hl-mode' : '') + '">' + out + '</div>';
  }

  function dayChipsHTML(nDays, day, attr) {
    var h = '<div class="chips">';
    for (var d = 0; d < nDays; d++) h += '<button class="chip' + (day === d ? ' active' : '') + '" ' + attr + '="' + d + '">' + DAY_SHORT(d) + '</button>';
    h += '<button class="chip' + (day === 'week' ? ' active' : '') + '" ' + attr + '="week">' + t('week') + '</button></div>';
    return h;
  }

  function defaultDay() {
    var wd = new Date().getDay();               // 0 = воскресенье
    if (window.innerWidth >= 900) return 'week';
    return wd >= 1 && wd <= 6 ? wd - 1 : 0;
  }

  function groupsHTML(filterFn, highlight) {
    var byCourse = {}, any = false;
    for (var i = 0; i < DATA.length; i++) {
      var g = DATA[i];
      if (filterFn && !filterFn(g)) continue;
      (byCourse[g.course] = byCourse[g.course] || []).push(g);
      any = true;
    }
    if (!any) return '';
    var h = '';
    for (var c = 1; c <= 4; c++) {
      if (!byCourse[c]) continue;
      h += '<div class="course-row"><h3>' + t('course', { n: c }) + '</h3><div class="group-grid">';
      for (var k = 0; k < byCourse[c].length; k++) {
        var n = byCourse[c][k].name;
        h += '<a class="group-btn' + (n === highlight ? ' mine' : '') + '" href="#schedule/' + enc(n) + '">' + esc(n) + '</a>';
      }
      h += '</div></div>';
    }
    return h;
  }

  function teacherCardHTML(tc) {
    var subj = tc.subjectList.slice(0, 2).join(', ') + (tc.subjectList.length > 2 ? ' +' + (tc.subjectList.length - 2) : '');
    return '<a class="card" href="#teachers/' + enc(tc.name) + '">' +
           '<div class="avatar">' + initials(tc.name) + '</div>' +
           '<div class="info"><b>' + esc(tc.name) + '</b><span>' + esc(subj) + '</span></div>' +
           '<div class="load"><strong>' + tc.pairs + '</strong>' + t('pairsShort', { n: tc.pairs }) + '</div></a>';
  }

  /* ---------- Поиск ---------- */
  var LATIN = { web: 'веб', ret: 'рэт', eo: 'эо', emn: 'эмн', em: 'эм', ve: 'вэ', esn: 'эсн', tet: 'тэт', autp: 'аутп', men: 'мен', po: 'по' };
  function normGroup(s) {
    s = s.toLowerCase();
    for (var k in LATIN) s = s.split(k).join(LATIN[k]);
    return s.replace(/[^a-zа-яёәғқңөұүһі0-9]/g, '');
  }
  var searchFilter = 'all';
  var input = document.getElementById('searchInput');
  var results = document.getElementById('searchResults');

  function runSearch() {
    var raw = input.value.replace(/^\s+|\s+$/g, '');
    var q = raw.toLowerCase(), qg = normGroup(raw);
    var h = '';
    if (searchFilter !== 'teachers') {
      var gh = groupsHTML(function (g) { return !qg || normGroup(g.name).indexOf(qg) !== -1; });
      if (gh) h += '<p class="section-title">' + t('groupsTap') + '</p>' + gh;
    }
    if (searchFilter !== 'groups') {
      var th = '';
      for (var i = 0; i < teacherList.length; i++) {
        var tc = teacherList[i];
        if (!q || (tc.name + ' ' + tc.subjectList.join(' ')).toLowerCase().indexOf(q) !== -1) th += teacherCardHTML(tc);
      }
      if (th) h += '<p class="section-title">' + t('teachersTitle') + '</p><div class="cards">' + th + '</div>';
    }
    results.innerHTML = h || '<p class="empty">' + t('nothing') + '</p>';
  }
  input.addEventListener('input', runSearch);
  document.getElementById('searchFilter').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.chip') : null;
    if (!b) return;
    searchFilter = b.getAttribute('data-f');
    var all = this.querySelectorAll('.chip');
    for (var i = 0; i < all.length; i++) all[i].className = 'chip' + (all[i] === b ? ' active' : '');
    runSearch();
  });
  runSearch();

  /* ---------- Teachers ---------- */
  var pageTeachers = document.getElementById('page-teachers');
  var teacherFilter = '';
  var tState = { day: 'week', only: false };

  function renderTeacherList() {
    pageTeachers.innerHTML =
      '<h1>' + t('navTeachers') + '</h1><p class="sub">' + t('teachersSub', { n: teacherList.length }) + '</p>' +
      '<label class="search-box small"><svg viewBox="0 0 24 24" fill="none" stroke="#7a8aa3" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>' +
      '<input type="text" id="teacherFilter" placeholder="' + esc(t('teacherPh')) + '" autocomplete="off" value="' + esc(teacherFilter) + '"></label>' +
      '<div class="cards" id="teacherCards"></div>';
    var f = document.getElementById('teacherFilter');
    function fill() {
      teacherFilter = f.value;
      var q = f.value.toLowerCase().replace(/^\s+|\s+$/g, ''), h = '';
      for (var i = 0; i < teacherList.length; i++) {
        var tc = teacherList[i];
        if (!q || (tc.name + ' ' + tc.subjectList.join(' ')).toLowerCase().indexOf(q) !== -1) h += teacherCardHTML(tc);
      }
      document.getElementById('teacherCards').innerHTML = h || '<p class="empty">' + t('noOne') + '</p>';
    }
    f.addEventListener('input', fill);
    fill();
  }

  function renderTeacher(name, groupName) {
    var tc = teachers[name];
    if (!tc) { renderTeacherList(); return; }
    var groupNames = Object.keys(tc.groups).sort(function (a, b) {
      return groupsByName[a].course - groupsByName[b].course || a.localeCompare(b, 'ru');
    });
    var maxDay = Math.max.apply(null, tc.days) || 1;
    var nDays = tc.days[5] ? 6 : 5;

    var bars = '';
    for (var d = 0; d < nDays; d++) {
      bars += '<div class="day-bar' + (tc.days[d] ? '' : ' zero') + '"><b>' + tc.days[d] + '</b><i style="height:' + Math.round(tc.days[d] / maxDay * 56 + 4) + 'px"></i><span>' + DAY_SHORT(d) + '</span></div>';
    }

    var tags = '';
    for (var s = 0; s < tc.subjectList.length; s++) tags += '<span class="tag">' + esc(tc.subjectList[s]) + '</span>';

    var groupBtns = '<div class="group-grid">';
    for (var k = 0; k < groupNames.length; k++) {
      var gn = groupNames[k];
      groupBtns += '<a class="group-btn' + (gn === groupName ? ' mine' : '') + '" href="#teachers/' + enc(name) + '/' + enc(gn) + '">' +
                   esc(gn) + ' <small style="font-weight:500;opacity:.55">' + tc.groups[gn] + '</small></a>';
    }
    groupBtns += '</div>';

    var h =
      '<a class="back" href="#teachers"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>' + t('allTeachers') + '</a>' +
      '<div class="profile">' +
        '<div class="profile-top"><div class="avatar">' + initials(name) + '</div><div><h1>' + esc(name) + '</h1><p>' + t('teacher') + '</p></div></div>' +
        '<div class="stats">' +
          '<div class="stat hl"><strong>' + tc.pairs + '</strong><span>' + t('statPairs', { n: tc.pairs }) + '</span></div>' +
          '<div class="stat"><strong>' + groupNames.length + '</strong><span>' + t('statGroups', { n: groupNames.length }) + '</span></div>' +
          '<div class="stat"><strong>' + tc.subjectList.length + '</strong><span>' + t('statSubjects', { n: tc.subjectList.length }) + '</span></div>' +
        '</div>' +
        '<p class="section-title">' + t('subjects') + '</p><div class="tags">' + tags + '</div>' +
        '<p class="section-title">' + t('byDay') + '</p><div class="days-bars">' + bars + '</div>' +
      '</div>' +
      '<div class="profile"><p class="section-title" style="margin-top:0">' + t('groupsPick') + '</p>' + groupBtns + '</div>' +
      '<div id="teacherGroupSchedule"></div>';
    pageTeachers.innerHTML = h;

    if (groupName && groupsByName[groupName]) renderTeacherGroup(name, groupName);
  }

  function renderTeacherGroup(name, groupName) {
    var g = groupsByName[groupName];
    var sch = g.schedules[g.cur];
    var box = document.getElementById('teacherGroupSchedule');
    var nDays = daysUsed(sch.lessons);
    box.innerHTML =
      '<div class="group-head"><div><h1>' + esc(g.name) + '</h1><p>' + t('course', { n: g.course }) + (sch.period ? ' · ' + esc(sch.period) : '') + '</p>' +
      (g.ended ? '<span class="note">' + t('ended') + '</span>' : '') + '</div>' +
      '<a class="btn" href="#schedule/' + enc(g.name) + '">' + t('openSchedule') + '</a></div>' +
      '<div class="legend"><i></i>' + t('legend', { name: esc(name), n: teachers[name].groups[g.name] || 0 }) + '</div>' +
      dayChipsHTML(nDays, tState.day, 'data-tday') +
      '<div class="chips"><button class="chip' + (!tState.only ? ' active' : '') + '" data-only="0">' + t('fullSchedule') + '</button>' +
      '<button class="chip' + (tState.only ? ' active' : '') + '" data-only="1">' + t('onlyTheirs') + '</button></div>' +
      scheduleHTML(sch.lessons, g.name, tState.day, name, tState.only);

    box.onclick = function (e) {
      var b = e.target.closest ? e.target.closest('[data-tday],[data-only]') : null;
      if (!b) return;
      if (b.hasAttribute('data-tday')) { var v = b.getAttribute('data-tday'); tState.day = v === 'week' ? 'week' : +v; }
      else tState.only = b.getAttribute('data-only') === '1';
      renderTeacherGroup(name, groupName);
    };
  }

  /* ---------- Schedule ---------- */
  var pageSchedule = document.getElementById('page-schedule');
  var sState = { day: defaultDay(), period: {} };

  function renderSchedule(groupName) {
    var g = groupsByName[groupName];
    if (!g) {
      pageSchedule.innerHTML =
        '<h1>' + t('navSchedule') + '</h1><p class="sub">' + t('pickGroup') + '</p>' +
        '<div class="prompt">' + groupsHTML() + '</div>';
      return;
    }
    store('lastGroup', g.name);
    var idx = sState.period[g.name] !== undefined ? sState.period[g.name] : g.cur;
    var sch = g.schedules[idx];
    var nDays = daysUsed(sch.lessons);
    if (sState.day !== 'week' && sState.day >= nDays) sState.day = 0;

    var periods = '';
    if (g.schedules.length > 1) {
      periods = '<div class="chips">';
      for (var i = 0; i < g.schedules.length; i++) {
        periods += '<button class="chip' + (i === idx ? ' active' : '') + '" data-period="' + i + '">' + esc(g.schedules[i].period || t('mainPeriod')) + '</button>';
      }
      periods += '</div>';
    }
    var ended = sch.to && sch.to < TODAY;

    pageSchedule.innerHTML =
      '<div class="group-head"><div><h1>' + esc(g.name) + '</h1><p>' + t('course', { n: g.course }) + (sch.period ? ' · ' + esc(sch.period) : '') + '</p>' +
      (ended ? '<span class="note">' + t('ended') + '</span>' : '') + '</div>' +
      '<a class="btn" href="#search">' + t('changeGroup') + '</a></div>' +
      periods +
      dayChipsHTML(nDays, sState.day, 'data-sday') +
      '<div id="scheduleBody">' + scheduleHTML(sch.lessons, g.name, sState.day, null, false) + '</div>' +
      '<p class="note-src">' + t('tapTeacher') + '</p>';

    pageSchedule.onclick = function (e) {
      var b = e.target.closest ? e.target.closest('[data-sday],[data-period]') : null;
      if (!b) return;
      if (b.hasAttribute('data-sday')) { var v = b.getAttribute('data-sday'); sState.day = v === 'week' ? 'week' : +v; }
      else sState.period[g.name] = +b.getAttribute('data-period');
      renderSchedule(groupName);
    };
  }

  /* ---------- Навигация (адрес вида #schedule/ВЕБ-242) ---------- */
  var tabs = document.querySelectorAll('.tab');
  var pages = { teachers: pageTeachers, search: document.getElementById('page-search'), schedule: pageSchedule };

  function route(keep) {
    var parts = location.hash.replace(/^#/, '').split('/');
    for (var i = 0; i < parts.length; i++) { try { parts[i] = decodeURIComponent(parts[i]); } catch (e) {} }
    var tab = pages[parts[0]] ? parts[0] : 'teachers';

    for (var k = 0; k < tabs.length; k++) {
      var on = tabs[k].getAttribute('data-tab') === tab;
      tabs[k].className = 'tab' + (on ? ' active' : '');
      if (on) tabs[k].setAttribute('aria-current', 'page'); else tabs[k].removeAttribute('aria-current');
    }
    for (var p in pages) pages[p].className = 'page' + (p === tab ? ' active' : '');

    if (tab === 'teachers') {
      if (parts[1]) { tState.only = false; renderTeacher(parts[1], parts[2]); } else renderTeacherList();
    } else if (tab === 'schedule') {
      renderSchedule(parts[1] || store('lastGroup'));
    }

    var page = pages[tab];
    if (keep) return;                            // смена языка: без анимации и прокрутки
    page.className = 'page active';
    void page.offsetWidth;                       // перезапуск анимации появления
    page.className = 'page active anim';

    if (tab === 'teachers' && parts[2]) {
      var box = document.getElementById('teacherGroupSchedule');
      if (box && box.getBoundingClientRect) window.scrollTo(0, box.getBoundingClientRect().top + window.pageYOffset - 16);
    } else {
      window.scrollTo(0, 0);
    }
  }

  for (var k = 0; k < tabs.length; k++) {
    tabs[k].addEventListener('click', function () {
      var tab = this.getAttribute('data-tab');
      var target = '#' + tab;
      if (tab === 'schedule' && store('lastGroup')) target += '/' + enc(store('lastGroup'));
      if (location.hash === target) route(); else location.hash = target;
    });
  }
  window.addEventListener('hashchange', function () { route(); });
  window.onLangChange = function () { runSearch(); route(true); };
  route();
})();
</script>
</body>
</html>
